<!DOCTYPE html>
<html>

<head>
  <title>Delete date idea</title>
</head>

<body>
  <h1>Delete date idea</h1>
  <p>Title: {{item.title}}</p>
  <p>Are you sure you want to delete this date idea?</p>
  <form action="/remove_item/{{ item.id }}" method="post">
    <input type="submit" name="remove" value="Yes, delete idea">
    <input type="submit" name="back" value="No, take me back">
  </form>
</body>

</html>
