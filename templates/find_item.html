<!DOCTYPE html>
<html>

<head>
  <title>Search for ideas</title>
</head>

<body>
  <h1>Search for ideas</h1>

  <form action="/find_item" method="get">
    <p>
      Keyword: <input type="text" name="query" value="{{ query }}">
    </p>
    <input type="submit" value="Search">
  </form>

  <p>
    <a href="/">Back to front page</a>

  {% if query %}
  <h2>Results</h2>

  <ul>
    {% for item in results %}
    <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</body>

</html>
