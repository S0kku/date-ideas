{% extends "layout.html" %}

{% block title %}Search for ideas{% endblock %}

{% block content %}
<h2>Search for ideas</h2>

<form action="/find_item" method="get">
  <p>
    Keyword: <input type="text" name="query" value="{{ query }}">
  </p>
  <input type="submit" value="Search">
</form>

{% if query %}
<h2>Results</h2>

<ul>
  {% for item in results %}
  <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
