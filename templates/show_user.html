{% extends "layout.html" %}

{% block title %}{{ user.username }}{% endblock %}

{% block content %}
<h2>Dates by {{ user.username }}</h2>
<p>
  Number of dates planned by {{ user.username }}: {{ items | count }}
</p>
<h2>Browse ideas</h2>
<ul>
  {% for item in items %}
  <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
