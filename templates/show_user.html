<!DOCTYPE html>
<html>

<head>
  <title>Dates by {{ user.username }}'</title>
</head>

<body>
  <h1>Dates by {{ user.username }}</h1>
  <p>
    Number of dates planned by {{ user.username }}: {{ items | count }}
  </p>
  <h2>Browse ideas</h2>
  <ul>
    {% for item in items %}
    <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
    {% endfor %}
  </ul>
  <p>
    <a href="/">Back to front page</a>
  </p>
</body>

</html>
