<!DOCTYPE html>
<html>

<head>
  <title>Edit date idea</title>
</head>

<body>
  <h1>Edit date idea</h1>
  <form action="/update_item" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" value="{{ item.title }}" maxlength="50" required />
    </p>
    <p>
      Describe your date: <br />
      <textarea name="description" rows="10" cols="60"  maxlength="1000" required >{{ item.description }} </textarea>
      </p>
    <input type="hidden" name="item_id" value="{{ item.id}}" />
    <input type="submit" value="Update idea" />
  </form>
</body>

</html>
