<!DOCTYPE html>
<html>

<head>
  <title>Plan a date</title>
</head>

<body>
  <h1>New date idea</h1>
  <form action="/create_item" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" />
    </p>
    <p>
      Describe your date: <br />
      <textarea name="description" rows="10" cols="60"></textarea>
      </p>
    <input type="submit" value="Post idea" />
  </form>
</body>

</html>
