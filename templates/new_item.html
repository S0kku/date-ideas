<!DOCTYPE html>
<html>

<head>
  <title>Plan a date</title>
</head>

<body>
  <h1>New date idea</h1>
  <form action="/create_item" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" maxlength="50" required />
    </p>
    <p>
      Describe your date: <br />
      <textarea name="description" rows="10" cols="60" maxlength="1000" required></textarea>
    </p>
    <p>
      Main activity: <br />
      <select name="section">
        <option value="">( choose )</option>
        <option value="Active / Outdoors">Active / Outdoors</option>
        <option value="Arts / Crafts">Arts / Crafts</option>
        <option value="Food / Restaurants">Food / Restaurants</option>
        <option value="Games / Series">Games / Series</option>
        <option value="Museum / Sightseeing">Museum / Sightseeing</option>
      </select>
    </p>
    <p>
      Price range: <br />
      <select name="cost">
        <option value="">( choose )</option>
        <option value="High">High cost</option>
        <option value="Medium">Medium cost</option>
        <option value="Low">Low cost</option>
        <option value="Free">Free of charge</option>
      </select>
    </p>
    <input type="submit" value="Post idea" />
  </form>
</body>

</html>
