<!DOCTYPE html>
<html>

<head>
  <title>{{ item.title }}</title>
</head>

<body>
  <h1>{{ item.title }}</h1>
  <p>
    {{ item.description }}
  </p>
  <p>
    Date idea by: {{ item.username }}
  </p>
  {% if session.user_id == item.user_id %}
  <p>
    <a href="/edit_item/{{ item.id }}">Edit</a>
  </p>
  {% endif %}
  <p>
    <a href="/">Go to front page</a>
  </p>
</body>

</html>
