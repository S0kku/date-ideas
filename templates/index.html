{% extends "layout.html" %}

{% block title %}Date ideas{% endblock %}

{% block content %}
<h2>All date ideas</h2>


{% for item in items %}
<div class="item">
<a href="/item/{{ item.id }}">{{ item.title }}</a> <br />
Idea by: <a href="/user/{{ item.user_id }}">{{ item.username }}</a> <br />
Comments: {{ item.comment_count }}
</div>
{% endfor %}

{% endblock %}
