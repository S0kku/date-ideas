<!DOCTYPE html>
<html>

<head>
  <title>Date ideas</title>
</head>

<body>
  <h1>Date ideas</h1>

  {% if session.username %}
  <p>
    Logged in as {{ session.username }}
  </p>
  {% endif %}

  <p>
    <a href="/find_item">Search</a> |
  {% if session.user_id %}
    <a href="/new_item">Plan a date</a> |
    <a href="/logout">Log out</a>
  {% else %}
    <a href="/register">Register</a> |
    <a href="/login">Log in</a>
  {% endif %}
  </p>

    <h2>All ideas</h2>
    <ul>
      {% for item in items %}
      <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
</body>

</html>
